<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure RAG Assistant</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .chat-container{
            width:100%;
            max-width:1000px;
            height:90vh;
            background:#fff;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(0,0,0,0.2);
            display:flex;
            flex-direction:column;
        }

        .header{
            background:#4f46e5;
            color:white;
            padding:20px;
            text-align:center;
        }

        .header h1{
            font-size:28px;
        }

        .header p{
            opacity:0.9;
            margin-top:5px;
        }

        .chat-body{
            flex:1;
            padding:20px;
            overflow-y:auto;
            background:#f8fafc;
        }

        .message{
            margin-bottom:20px;
            display:flex;
            flex-direction:column;
        }

        .user-message{
            align-items:flex-end;
        }

        .bot-message{
            align-items:flex-start;
        }

        .bubble{
            max-width:80%;
            padding:15px;
            border-radius:15px;
            line-height:1.6;
            word-wrap:break-word;
        }

        .user-message .bubble{
            background:#4f46e5;
            color:white;
        }

        .bot-message .bubble{
            background:white;
            border:1px solid #ddd;
            color:#333;
        }

        .input-area{
            padding:20px;
            border-top:1px solid #ddd;
            background:white;
        }

        .form-group{
            display:flex;
            gap:10px;
        }

        textarea{
            flex:1;
            resize:none;
            border:2px solid #ddd;
            border-radius:12px;
            padding:12px;
            font-size:16px;
            min-height:60px;
            outline:none;
        }

        textarea:focus{
            border-color:#4f46e5;
        }

        button{
            background:#4f46e5;
            color:white;
            border:none;
            padding:0 25px;
            border-radius:12px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
            transition:.3s;
        }

        button:hover{
            background:#4338ca;
        }

        .welcome{
            text-align:center;
            margin-top:100px;
            color:#666;
        }

        .welcome h2{
            margin-bottom:10px;
        }

        @media(max-width:768px){

            .chat-container{
                height:100vh;
                border-radius:0;
            }

            .bubble{
                max-width:95%;
            }

            .form-group{
                flex-direction:column;
            }

            button{
                height:50px;
            }
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>Azure AI RAG Assistant</h1>
        <p>Powered by Azure OpenAI & Azure AI Search</p>
    </div>

    <div class="chat-body">

        {% if question %}

        <div class="message user-message">
            <div class="bubble">
                {{question}}
            </div>
        </div>

        {% endif %}

        {% if answer %}

        <div class="message bot-message">
            <div class="bubble">
                {{answer}}
            </div>
        </div>

        {% else %}

        <div class="welcome">
            <h2>👋 Welcome</h2>
            <p>Ask anything from your knowledge base.</p>
        </div>

        {% endif %}

    </div>

    <div class="input-area">

        <form action="/ask" method="post">

            <div class="form-group">

                <textarea
                    name="question"
                    placeholder="Type your question here..."
                    required></textarea>

                <button type="submit">
                    Send
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
